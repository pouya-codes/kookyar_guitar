plugins {
    id 'com.android.application'
}

android {
    namespace 'com.PouyaApp.kookyargitar'
    compileSdk 37

    defaultConfig {
        minSdk 28
        targetSdk 37
        versionName '5.4.0'
        versionCode 54

        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        noCompress 'arsc'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

// Store flavors: bazaar (PouyaApps key) and play (TuningApps key). Shared with every KookYar app.
ext.kookyarStoreIds = [bazaar: 'com.PouyaApp.kookyargitar', play: 'com.TuningApps.kookyargitar']
// Play App Signing app: upload key is PouyaApps.jks (TuningApps.jks signs other apps for users).
ext.kookyarPlayKey = 'pouyaapps'
apply from: "${rootProject.projectDir}/../kookyar_common/kookyar-store-flavors.gradle"

dependencies {
    implementation 'com.kookyar:kookyar-common'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'

    // libpd 1.4.3 snapshot (2026-10-26), vendored so the build is reproducible: its native
    // libraries are 16 KB page-aligned, which Google Play requires for targetSdk 35+.
    // The last Maven release (1.2.1-rc6) is not. Shared by all KookYar apps.
    implementation files("${rootProject.projectDir}/../kookyar_common/libs/pd-core-1.4.3-20261026.aar")
}
